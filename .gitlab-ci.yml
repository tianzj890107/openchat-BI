# eimosp-ontology-agentic-analytics — GitLab CI/CD
#
# 运行节点：项目 runner `sys740-docker-runner`（172.16.10.34，docker executor，
# 默认镜像 `boulderai/analytics-ci:3.13`）。该 runner 被设置为不执行 untagged
# job，所以本文件里每个 job 都必须声明 `tags: [boulderai]`。
#
# 这个 pipeline 只做验证：单元测试 + 分析 Agent 黄金集。没有 deploy stage，
# job 也不写服务器，push 不会触发任何部署（部署口径见 DEPLOYMENT.md §11）。
#
# 镜像里已经预装了 pyproject.toml 声明的全部依赖和 pytest，job 只需要一次
# 离线的 `pip install -e . --no-deps`；pyproject 依赖变化时重建镜像：
#   docker build -t boulderai/analytics-ci:3.13 ~/ci-image/deps

stages:
  - test
  - eval

default:
  image: boulderai/analytics-ci:3.13
  tags:
    - boulderai
  interruptible: true
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - python -m pip install --quiet -e . --no-deps

variables:
  PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  # 仓库策略类测试要读完整历史和 tag，浅克隆会误报失败。
  GIT_DEPTH: "0"

unit-tests:
  stage: test
  script:
    # 唯一跳过的用例读取 frontend/node_modules/@boulderaitech/ontology-graph，
    # 该包是 `file:../../ontology-graph` 本地依赖，远端 ai-team/ontology-graph
    # 仓库目前为空，CI 无法提供；本地开发机装了 npm 依赖后仍会正常执行。
    - >-
      python -m pytest -q tests
      --deselect
      tests/test_regressions.py::OfflineRegressionTests::test_ontology_graph_modal_uses_product_labels_and_synced_cluster_layout

analytics-eval-smoke:
  stage: eval
  script:
    - python -m scripts.run_analytics_eval --suite smoke
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - dataset/evals/analytics/reports/

analytics-eval-regression:
  stage: eval
  script:
    - python -m scripts.run_analytics_eval --suite regression
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - dataset/evals/analytics/reports/

analytics-eval-recorded-provider:
  stage: eval
  script:
    # 录制 provider 回放：真实会话循环 + 真实工具 + 只读 SQLite fixture。
    # 离线、确定、不需要任何凭据；所有写入都落在临时目录。
    - >-
      python -m scripts.run_analytics_eval
      --suite recorded-provider
      --out dataset/evals/analytics/reports
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - dataset/evals/analytics/reports/

analytics-eval-repeat-stability:
  stage: eval
  script:
    # 同一批案例重跑两次：第二次必须使用与第一次相同的 evaluator，并且
    # 语义指纹（意图/工具顺序/SQL 语义/数字/证据/图表/结论结构）保持一致。
    - >-
      python -m scripts.run_analytics_eval
      --suite recorded-provider
      --repeat 2
      --out dataset/evals/analytics/reports
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - dataset/evals/analytics/reports/

# 发布门禁：未解决的 P0 known gap 必须逐条进入「已审计 allowlist」。
# 当前 allowlist 为空，所以只要还有 P0 缺陷，这个 job 就必然失败——这正是它
# 存在的意义。
#
# `allow_failure: false` + `when: manual` 是一个**阻塞式手动 job**：pipeline 会停在
# "blocked" 状态，必须由人显式执行并通过，才能继续/完成。这样它既不会在普通开发
# pipeline 上自动跑（发布节奏由人控制），也不会再被"允许失败"悄悄放过。
#
# 没有独立的 release pipeline / tag pipeline 时，发布流程为：
#   1. 人工在本次 pipeline 上执行本 job；
#   2. job 必须 PASS（`--release` 返回 0）；
#   3. 失败即禁止发布，直到缺陷修复或逐条 allowlist（含 reviewer/reviewed_at/
#      reason/expiry/target_fix_version）并给出审计说明。
# tag pipeline 上它会自动执行且同样不允失败。
analytics-eval-release-gate:
  stage: eval
  rules:
    - if: '$CI_COMMIT_TAG'
      when: always
    - when: manual
  allow_failure: false
  script:
    # 发布门禁必须**重复运行**：稳定性指标未测量（即未做重复运行）会让发布运行
    # 直接失败，所以这里固定重复两次（smoke 140 条，成本可接受）。
    - >-
      python -m scripts.run_analytics_eval
      --suite smoke
      --repeat 2
      --release
      --out dataset/evals/analytics/reports
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - dataset/evals/analytics/reports/

# 在线金丝雀：**不在默认 pipeline 中运行**，也不自动消费任何真实凭据。
# 没有配置 provider 凭据时，runner 会把整套标记为 not_measured/skipped，绝不会
# 报告成 passed（status=not_measured、每条用例 skip）；缺凭据时状态同样写进
# report["skipped"]。人工触发示例见 dataset/evals/analytics/README.md §3 在线评测。
analytics-eval-live-canary:
  stage: eval
  rules:
    - when: manual
  allow_failure: true
  script:
    - >-
      python -m scripts.run_analytics_eval
      --suite live-canary
      --provider deepseek
      --out dataset/evals/analytics/reports
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dataset/evals/analytics/reports/

cockpit-eval-observe:
  stage: eval
  allow_failure: true
  script:
    - mkdir -p dataset/evals/cockpit/reports
    - python -m scripts.run_cockpit_eval --output dataset/evals/cockpit/reports/latest.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - dataset/evals/cockpit/reports/
