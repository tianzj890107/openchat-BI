<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>本体消费展示工作台 · AgentKit</title>
    <link
      rel="stylesheet"
      href="@@APP_ROOT_PATH@@/static/vendor/agentkit/workbench-agentkit.css?v=@@AGENTKIT_CSS_VERSION@@"
    />
  </head>
  <body class="ak-page">
    <!-- First paint: the AgentKit shell with empty panes. React replaces this
         subtree on mount, so the layout never flashes between deployments. -->
    <div id="agentkit-root" data-agentkit-root="1" aria-busy="true">
      <div class="ak-shell">
        <header class="ak-topbar" data-agentkit-handoff>
          <div class="ak-brand">
            <span class="ak-brand-mark" aria-hidden="true"></span>
            <span class="ak-brand-name">本体消费展示工作台</span>
            <span class="ak-brand-chip">AgentKit</span>
          </div>
          <div class="ak-topbar-actions">
            <button type="button" class="ak-ghost" data-agentkit-layout-toggle aria-label="在对话与结果之间切换">
              切换视图
            </button>
          </div>
        </header>
        <div class="ak-main">
          <aside class="ak-sessions" data-agentkit-sessions aria-label="会话列表">
            <div class="ak-skeleton-row"></div>
            <div class="ak-skeleton-row"></div>
            <div class="ak-skeleton-row"></div>
          </aside>
          <section class="ak-thread" data-agentkit-thread aria-label="对话">
            <div class="ak-boot">正在加载本体消费展示工作台…</div>
          </section>
          <section class="ak-board" data-agentkit-board aria-label="分析结果">
            <div class="ak-skeleton-card"></div>
            <div class="ak-skeleton-card"></div>
          </section>
        </div>
      </div>
    </div>
    <script src="@@APP_ROOT_PATH@@/static/vendor/agentkit/workbench-agentkit.js?v=@@AGENTKIT_JS_VERSION@@" defer></script>
  </body>
</html>
