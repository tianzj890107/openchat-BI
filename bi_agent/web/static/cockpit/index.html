<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="app-root" content="@@APP_ROOT_PATH@@">
  <meta name="cockpit-page" content="@@COCKPIT_PAGE@@">
  <meta name="cockpit-version" content="@@COCKPIT_VERSION@@">
  <meta name="cockpit-api-base" content="@@APP_ROOT_PATH@@/api/cockpit">
  <title>储小策 · 经营驾驶舱</title>
  <link rel="stylesheet" href="@@APP_ROOT_PATH@@/static/cockpit/vendor/pro-ui.min.css?v=b1ee836d">
  <link rel="stylesheet" href="@@APP_ROOT_PATH@@/static/cockpit/cockpit.css?v=@@COCKPIT_VERSION@@">
  <script src="@@APP_ROOT_PATH@@/static/vendor/antd/lib/vue.global.js"></script>
  <script src="@@APP_ROOT_PATH@@/static/cockpit/vendor/pro-bi-ui.min.js?v=011269f8"></script>
</head>
<body>
  <div id="app" v-cloak>
    <main class="cockpit-main" :data-page="page" :aria-label="pageTitle">
      <h1 class="visually-hidden">{{pageTitle}}</h1>
      <div v-if="error" class="cockpit-state error" role="alert">{{error}}</div>
      <div v-else-if="loading" class="cockpit-state">正在加载正式看板配置…</div>
      <div v-else class="cockpit-board">
        <component :is="dashboardComponent" :key="dashboard.id"
                   :components="dashboard.components"
                   :template-registry="runtime.templates"
                   :insights="pageInsights"
                   :bi-adapters="biAdapters"
                   :utils="hostUtils"
                   :title="dashboard.name"
                   :description="dashboard.description"
                   :header-layout="dashboard.headerLayout"
                   :grid-cols="dashboard.gridCols"
                   :row-height="dashboard.rowHeight"
                   :margin="[8, 8]"
                   show-header-title
                   mode="release">
          <template v-for="insight in pageInsights" :key="insight.id"
                    v-slot:[slot_name(insight)]="slotProps">
            <cockpit-insight :insight="insight" :slot-props="slotProps"></cockpit-insight>
          </template>
        </component>
      </div>

      <details v-if="gaps.length" class="cockpit-gap-report">
        <summary>元数据缺失与渲染限制 · {{gaps.length}} 项</summary>
        <div class="cockpit-gap-body">
          <p>页面只渲染交付元数据原样结构，宿主不增删、不重排卡片。缺失组件、缺失数据或没有对应组件的位置保留空位并在下方列明；静态快照未覆盖的 AP 查询仍显示原卡片错误。</p>
          <ul>
            <li v-for="gap in gaps" :key="gap.code + (gap.componentId || gap.description)">
              <b>{{gap.code}}</b><small>{{gap.description}}</small>
            </li>
          </ul>
          <p v-if="metadataSummary" class="cockpit-gap-meta">{{metadataSummary}}</p>
        </div>
      </details>

    </main>
  </div>
  <noscript>驾驶舱需要启用 JavaScript。</noscript>
  <script src="@@APP_ROOT_PATH@@/static/cockpit/cockpit.js?v=@@COCKPIT_VERSION@@"></script>
</body>
</html>
