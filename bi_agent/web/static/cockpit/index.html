<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="app-root" content="@@APP_ROOT_PATH@@">
  <meta name="cockpit-page" content="@@COCKPIT_PAGE@@">
  <title>储小策 · 经营驾驶舱</title>
  <link rel="stylesheet" href="@@APP_ROOT_PATH@@/static/cockpit/vendor/pro-ui.min.css?v=ba407022">
  <link rel="stylesheet" href="@@APP_ROOT_PATH@@/static/cockpit/layout/prototype.css?v=prototype-layout-v2">
  <link rel="stylesheet" href="@@APP_ROOT_PATH@@/static/cockpit/cockpit.css?v=prototype-layout-v4">
  <script src="@@APP_ROOT_PATH@@/static/vendor/antd/lib/vue.global.js"></script>
  <script src="@@APP_ROOT_PATH@@/static/cockpit/vendor/pro-bi-ui.min.js?v=981e7d98"></script>
</head>
<body>
  <div id="app" v-cloak>
    <main class="cockpit-main" :data-page="page" :aria-label="pageTitle">
      <h1 class="visually-hidden">{{pageTitle}}</h1>
      <div v-if="error" class="cockpit-state error" role="alert">{{error}}</div>
      <div v-else-if="loading" class="cockpit-state">正在加载原型看板…</div>
      <div v-else class="dash-body cockpit-board" v-html="viewHtml" @click="boardClick" @keydown="boardKeydown"></div>

      <details v-if="groupedGaps.length" class="cockpit-gap-report">
        <summary>原型对照 · 本页 {{gaps.length}} 处缺失留空</summary>
        <div class="cockpit-gap-body">
          <p>布局按 V3 原型 DOM 尺寸渲染；交付元数据没有定义、或无法与原型逐项对齐的位置保持留空，不使用近似组件填充。</p>
          <ul>
            <li v-for="gap in groupedGaps" :key="gap.key">
              <b>{{gap.label}}</b><span>× {{gap.count}}</span>
              <small>{{gap.reason}}</small>
            </li>
          </ul>
          <p v-if="metadataSummary" class="cockpit-gap-meta">{{metadataSummary}}</p>
        </div>
      </details>

      <div v-if="toast" class="cockpit-toast" role="status">{{toast}}</div>
    </main>
  </div>
  <noscript>驾驶舱需要启用 JavaScript。</noscript>
  <script src="@@APP_ROOT_PATH@@/static/cockpit/cockpit.js?v=prototype-layout-v4"></script>
</body>
</html>
