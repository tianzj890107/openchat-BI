<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="app-root" content="@@APP_ROOT_PATH@@">
  <meta name="cockpit-page" content="@@COCKPIT_PAGE@@">
  <meta name="cockpit-version" content="@@COCKPIT_VERSION@@">
  <meta name="cockpit-assets" content="@@APP_ROOT_PATH@@/static/cockpit">
  <meta name="cockpit-api-base" content="@@APP_ROOT_PATH@@/api/cockpit">
  <title>储能经营风险驾驶舱</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230f62fe'/%3E%3Cpath d='M4 11V6h2v5H4zm3 0V3h2v8H7zm3 0V8h2v3h-2z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="@@APP_ROOT_PATH@@/static/cockpit/vendor/pro-ui.min.css?v=b1ee836d">
  <link rel="stylesheet" href="@@APP_ROOT_PATH@@/static/cockpit/host-colors.css?v=@@COCKPIT_VERSION@@">
  <link rel="stylesheet" href="@@APP_ROOT_PATH@@/static/cockpit/cockpit.css?v=@@COCKPIT_VERSION@@">
  <link rel="modulepreload" href="@@APP_ROOT_PATH@@/static/cockpit/data-client.js?v=@@COCKPIT_VERSION@@">
  <link rel="modulepreload" href="@@APP_ROOT_PATH@@/static/cockpit/page-client.js?v=@@COCKPIT_VERSION@@">
  <link rel="modulepreload" href="@@APP_ROOT_PATH@@/static/cockpit/publication-client.js?v=@@COCKPIT_VERSION@@">
  <link rel="modulepreload" href="@@APP_ROOT_PATH@@/static/cockpit/ai-publication-client.js?v=@@COCKPIT_VERSION@@">
</head>
<body>
  <div id="cockpit-boot" class="cockpit-loading" role="status" aria-busy="true" aria-label="正在加载经营看板">
    <span class="visually-hidden">正在加载经营看板</span>
    <div class="cockpit-loading__head">
      <span class="cockpit-loading__line cockpit-loading__line--title"></span>
      <span class="cockpit-loading__line cockpit-loading__line--subtitle"></span>
    </div>
    <div class="cockpit-loading__kpis">
      <div class="cockpit-loading__card cockpit-loading__card--kpi"><span class="cockpit-loading__line"></span><span class="cockpit-loading__line cockpit-loading__line--value"></span></div>
      <div class="cockpit-loading__card cockpit-loading__card--kpi"><span class="cockpit-loading__line"></span><span class="cockpit-loading__line cockpit-loading__line--value"></span></div>
      <div class="cockpit-loading__card cockpit-loading__card--kpi"><span class="cockpit-loading__line"></span><span class="cockpit-loading__line cockpit-loading__line--value"></span></div>
      <div class="cockpit-loading__card cockpit-loading__card--kpi"><span class="cockpit-loading__line"></span><span class="cockpit-loading__line cockpit-loading__line--value"></span></div>
    </div>
    <div class="cockpit-loading__panels">
      <div class="cockpit-loading__card cockpit-loading__card--chart"><span class="cockpit-loading__line cockpit-loading__line--panel"></span><span class="cockpit-loading__chart"></span></div>
      <div class="cockpit-loading__card cockpit-loading__card--chart"><span class="cockpit-loading__line cockpit-loading__line--panel"></span><span class="cockpit-loading__chart"></span></div>
    </div>
    <div class="cockpit-loading__card cockpit-loading__card--wide"><span class="cockpit-loading__line cockpit-loading__line--panel"></span><span class="cockpit-loading__chart cockpit-loading__chart--wide"></span></div>
  </div>
  <div id="app" v-cloak>
    <main class="cockpit-main" :data-page="page" :aria-label="pageTitle">
      <div v-if="frozenAnnualMode" class="cockpit-frozen-release" role="status">
        <span class="cockpit-frozen-release__basis" v-if="frozenAnnual.visible" :title="frozenAnnual.basis">{{frozenAnnual.period}} 年度已发布分析 · 独立于看板筛选</span>
        <button class="cockpit-frozen-release__action" type="button" :disabled="frozenAnnual.running" @click="refreshFrozenAnnual">{{frozenAnnual.visible ? '重新分析' : '分析'}}</button>
        <span class="cockpit-frozen-release__notice" v-if="frozenAnnual.running">后台分析中，当前结果可继续查看</span>
        <span class="cockpit-frozen-release__notice" v-else-if="frozenAnnual.error">{{frozenAnnual.error}}</span>
      </div>
      <h1 class="visually-hidden">{{pageTitle}}</h1>
      <div v-if="error" class="cockpit-state error" role="alert">
        <p>{{error}}</p>
        <button type="button" class="cockpit-state__retry" @click="retryRuntime">重新加载</button>
      </div>
      <cockpit-loading v-else-if="loading" label="正在加载经营看板"></cockpit-loading>
      <div v-else class="cockpit-board">
        <component :is="dashboardComponent" :key="dashboard.id + ':' + boardRevision"
                   :components="dashboard.components"
                   :template-registry="runtime.templates"
                   :insights="pageInsights"
                   :activate-rules="runtime.activateRules"
                   :bi-adapters="biAdapters"
                   :bi-runtime="biRuntime"
                   :utils="hostUtils"
                   :title="dashboard.name"
                   :description="dashboardDescription || dashboard.description"
                   :header-layout="dashboard.headerLayout"
                   :grid-cols="dashboard.gridCols"
                   :row-height="dashboard.rowHeight"
                   :margin="[8, 8]"
                   show-header-title
                   mode="release">
          <template v-for="insight in pageInsights" :key="insight.id"
                    v-slot:[slot_name(insight)]="slotProps">
            <cockpit-insight v-if="!frozenAnnualMode || frozenAnnual.visible" :insight="insight" :page="page" :slot-props="slotProps"></cockpit-insight>
          </template>
        </component>
      </div>

    </main>
  </div>
  <noscript>驾驶舱需要启用 JavaScript。</noscript>
  <script src="@@APP_ROOT_PATH@@/static/cockpit/vendor/vue.global.prod.js?v=3.5.25"></script>
  <script src="@@APP_ROOT_PATH@@/static/cockpit/vendor/pro-bi-ui.min.js?v=8520557f"></script>
  <!-- The BI UMD injects its default :root palette; load host overrides after it. -->
  <link rel="stylesheet" href="@@APP_ROOT_PATH@@/static/cockpit/vendor/bi-color-vars.css?v=572dcdf5">
  <script defer src="@@APP_ROOT_PATH@@/static/cockpit/cockpit.js?v=@@COCKPIT_VERSION@@"></script>
</body>
</html>
