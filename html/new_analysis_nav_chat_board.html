<h2 class="sr-only">新建分析对话三栏布局：左侧全局导航，中间独立对话框，右侧看板自动显示图表</h2>
<div style="display:flex; border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg); overflow:hidden; background:var(--color-background-primary); min-height:560px;">

  <div style="width:150px; flex-shrink:0; background:var(--color-background-secondary); border-right:0.5px solid var(--color-border-tertiary); padding:14px 9px; display:flex; flex-direction:column; gap:3px;">
    <div style="display:flex; align-items:center; gap:8px; padding:2px 6px 12px;">
      <i class="ti ti-chart-histogram" style="font-size:20px; color:var(--color-text-info)" aria-hidden="true"></i>
      <span style="font-weight:500; font-size:15px;">智析</span>
    </div>
    <button style="width:100%; justify-content:center; font-size:13px; padding:8px; margin-bottom:8px; background:var(--color-background-info); color:var(--color-text-info); border:0.5px solid var(--color-border-info);"><i class="ti ti-plus" style="font-size:15px; vertical-align:-2px" aria-hidden="true"></i> 新对话</button>

    <div style="display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:var(--border-radius-md); color:var(--color-text-secondary); font-size:13px;"><i class="ti ti-layout-grid" style="font-size:16px" aria-hidden="true"></i>概览</div>
    <div style="display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:var(--border-radius-md); background:var(--color-background-info); color:var(--color-text-info); font-size:13px;"><i class="ti ti-message-2" style="font-size:16px" aria-hidden="true"></i>对话分析</div>
    <div style="display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:var(--border-radius-md); color:var(--color-text-secondary); font-size:13px;"><i class="ti ti-layout-dashboard" style="font-size:16px" aria-hidden="true"></i>图表看板</div>
    <div style="display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:var(--border-radius-md); color:var(--color-text-secondary); font-size:13px;"><i class="ti ti-history" style="font-size:16px" aria-hidden="true"></i>历史记录</div>
    <div style="display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:var(--border-radius-md); color:var(--color-text-secondary); font-size:13px;"><i class="ti ti-box-multiple" style="font-size:16px" aria-hidden="true"></i>本体内容</div>

    <div style="font-size:11px; color:var(--color-text-tertiary); padding:14px 10px 6px;">最近</div>
    <div style="font-size:12px; color:var(--color-text-secondary); padding:6px 10px; border-radius:var(--border-radius-md); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">上周营收异常分析</div>
    <div style="font-size:12px; color:var(--color-text-secondary); padding:6px 10px; border-radius:var(--border-radius-md); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">华北区库存周转</div>
    <div style="font-size:12px; color:var(--color-text-secondary); padding:6px 10px; border-radius:var(--border-radius-md); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">新客留存对比</div>

    <div style="margin-top:auto; display:flex; align-items:center; gap:8px; padding:8px 10px; color:var(--color-text-tertiary); font-size:12px;"><i class="ti ti-user-circle" style="font-size:16px" aria-hidden="true"></i>李运营</div>
  </div>

  <div style="flex:1; min-width:0; display:flex; flex-direction:column; border-right:0.5px solid var(--color-border-tertiary);">
    <div style="padding:10px 14px; border-bottom:0.5px solid var(--color-border-tertiary); font-size:13px; font-weight:500; display:flex; align-items:center; gap:7px;"><i class="ti ti-message-2" style="font-size:15px; color:var(--color-text-secondary)" aria-hidden="true"></i>新分析对话</div>

    <div style="flex:1; padding:14px; display:flex; flex-direction:column; gap:13px;">
      <div style="align-self:flex-end; max-width:88%; background:var(--color-background-secondary); padding:9px 12px; border-radius:var(--border-radius-lg); font-size:13px; line-height:1.6;">上周营收怎么样？有异常吗？</div>

      <div>
        <div style="display:flex; align-items:center; gap:6px; margin-bottom:7px;">
          <i class="ti ti-sparkles" style="font-size:14px; color:var(--color-text-info)" aria-hidden="true"></i>
          <span style="font-size:11px; background:var(--color-background-info); color:var(--color-text-info); padding:3px 8px; border-radius:var(--border-radius-md);">意图 · 取数 + 异常</span>
        </div>
        <div style="font-size:13px; line-height:1.7;">上周营收 <span style="font-weight:500;">¥1,284,500</span>，环比 <span style="color:var(--color-text-danger);">−8.3%</span>。检测到 1 处异常，超出预期区间。图表见右侧看板。</div>
        <div style="display:flex; align-items:center; gap:10px; margin-top:8px;">
          <span style="font-size:11px; color:var(--color-text-success); display:inline-flex; align-items:center; gap:3px;"><i class="ti ti-circle-check" style="font-size:13px" aria-hidden="true"></i>确定性查询</span>
          <button onclick="sendPrompt('展开这条营收结果的底层 SQL')" style="font-size:11px; padding:3px 8px;">展开 SQL ↗</button>
        </div>
      </div>

      <div style="display:flex; flex-wrap:wrap; gap:7px;">
        <button onclick="sendPrompt('分析上周营收下滑的原因')" style="font-size:12px; padding:6px 10px;">分析原因 ↗</button>
        <button onclick="sendPrompt('给出决策建议')" style="font-size:12px; padding:6px 10px;">该怎么办 ↗</button>
      </div>
    </div>

    <div style="border-top:0.5px solid var(--color-border-tertiary); padding:10px 12px; display:flex; gap:8px; align-items:center;">
      <input type="text" placeholder="继续提问…" style="flex:1; height:34px;" />
      <button aria-label="发送" style="width:34px; padding:0;"><i class="ti ti-arrow-up" style="font-size:17px" aria-hidden="true"></i></button>
    </div>
  </div>

  <div style="flex:1.1; min-width:0; display:flex; flex-direction:column; background:var(--color-background-secondary);">
    <div style="padding:10px 14px; border-bottom:0.5px solid var(--color-border-tertiary); font-size:12px; color:var(--color-text-secondary); display:flex; align-items:center; gap:6px;"><i class="ti ti-layout-dashboard" style="font-size:15px" aria-hidden="true"></i>看板 · 自动显示</div>

    <div style="flex:1; padding:14px; display:flex; flex-direction:column; gap:12px;">
      <div style="background:var(--color-background-primary); border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg); padding:12px 14px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:7px;">
          <span style="font-size:12px; color:var(--color-text-secondary);">营收 · 上周</span>
          <button aria-label="固定到看板" style="width:25px; height:25px; padding:0;"><i class="ti ti-pin" style="font-size:14px" aria-hidden="true"></i></button>
        </div>
        <div style="display:flex; align-items:baseline; gap:9px;">
          <span style="font-size:22px; font-weight:500;">¥1.28M</span>
          <span style="font-size:13px; color:var(--color-text-danger); display:inline-flex; align-items:center; gap:2px;"><i class="ti ti-arrow-down-right" style="font-size:14px" aria-hidden="true"></i>8.3%</span>
        </div>
      </div>

      <div style="background:var(--color-background-primary); border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg); padding:12px 14px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:11px;">
          <span style="font-size:13px; font-weight:500;">营收趋势 · 近 8 周</span>
          <button aria-label="固定到看板" style="width:25px; height:25px; padding:0;"><i class="ti ti-pin" style="font-size:14px" aria-hidden="true"></i></button>
        </div>
        <div style="display:flex; align-items:flex-end; gap:5px; height:66px;">
          <div style="flex:1; height:58%; background:var(--color-border-secondary); border-radius:3px 3px 0 0;"></div>
          <div style="flex:1; height:66%; background:var(--color-border-secondary); border-radius:3px 3px 0 0;"></div>
          <div style="flex:1; height:62%; background:var(--color-border-secondary); border-radius:3px 3px 0 0;"></div>
          <div style="flex:1; height:74%; background:var(--color-border-secondary); border-radius:3px 3px 0 0;"></div>
          <div style="flex:1; height:80%; background:var(--color-border-secondary); border-radius:3px 3px 0 0;"></div>
          <div style="flex:1; height:78%; background:var(--color-border-secondary); border-radius:3px 3px 0 0;"></div>
          <div style="flex:1; height:84%; background:var(--color-border-secondary); border-radius:3px 3px 0 0;"></div>
          <div style="flex:1; height:55%; background:var(--color-text-danger); border-radius:3px 3px 0 0;"></div>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:8px; background:var(--color-background-danger); padding:9px 11px; border-radius:var(--border-radius-md);">
        <i class="ti ti-alert-triangle" style="font-size:16px; color:var(--color-text-danger)" aria-hidden="true"></i>
        <span style="font-size:12px; color:var(--color-text-danger); line-height:1.5;">异常 · 超出预期区间</span>
      </div>
    </div>
  </div>
</div>
