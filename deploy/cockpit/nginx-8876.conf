# DEPRECATED: 8876 is no longer maintained. Keep only as a historical Fuxi compatibility
# reference; current Workbench, Cockpit and MCP routes are served directly by 8765.
server {
    listen 80;
    server_name _;
    absolute_redirect off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "no-store" always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffering off;
    client_max_body_size 20m;

    location = / {
        proxy_pass http://172.16.10.34:8765/cockpit/overview;
    }
    location = /cockpit {
        proxy_pass http://172.16.10.34:8765/cockpit/overview;
    }
    location = /cockpit/ {
        proxy_pass http://172.16.10.34:8765/cockpit/overview;
    }
    # Preserve immutable assets for already-open pages from the retired static site.
    location /static/cockpit/releases/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        gzip_static on;
    }
    # Preserve URI/query: includes the main service's /api/ontology-agentic-analytics prefix.
    location / {
        proxy_pass http://172.16.10.34:8765;
    }
}
