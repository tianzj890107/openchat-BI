# Include in the existing server block. Replace the upstream with the target
# environment's reachable analytics address. No trailing slash on proxy_pass:
# preserve the prefix; the application strips it once.
location = /api/ontology-agentic-analytics {
    return 308 /api/ontology-agentic-analytics/;
}
location ^~ /api/ontology-agentic-analytics/ {
    proxy_pass http://ANALYTICS_UPSTREAM;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
