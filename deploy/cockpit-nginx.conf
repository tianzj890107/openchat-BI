# DEPRECATED: historical standalone Cockpit static-site proxy. Do not deploy or maintain;
# current Cockpit pages are served by the 8765 main service.
server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    charset utf-8;
    charset_types text/css application/javascript application/json;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location ~ ^/(?:cockpit(?:/(?:home|overview|operations|analysis))?/?|)$ {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
    location ^~ /static/cockpit/releases/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /static/ {
        expires 1h;
        try_files $uri =404;
    }
    location /api/cockpit/ {
        proxy_pass http://172.16.10.34:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
    }
    location /api/ { default_type application/json; return 404 '{"detail":"Not Found"}'; }
    location / { try_files $uri =404; }
}
